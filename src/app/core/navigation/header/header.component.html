<div class="head" [ngClass]="getHeadClass()">
    <div class="head-content">
        <div class="head-content-left">
            <div class="search-container">
                <div class="normal-search">
                    <input type="search" class="search" name="" id="" placeholder="Search...">
                    <i class="far fa-search search-icon"></i>
                </div> 

            </div>
        </div>
        <div class="head-content-right">
            <div class="head-menu">
                <div class="head-menu-item">

                    <button class="head-menu-item-btn ripple">
                        <i class="fa fa-camera-retro fa-lg menu-icon"></i>
                    </button>
                </div>
                <div class="head-menu-item">
                    <button class="head-menu-item-btn ripple">
                        <i class="far fa-expand menu-icon"></i>
                    </button>
                </div>
                <div class="head-menu-item">
                    <button class="head-menu-item-btn ripple">
                        <i class="far fa-comment-alt menu-icon"></i>
                    </button>
                </div>
                <div class="head-menu-item">
                    <div>
                        <button class="head-menu-item-btn ripple">
                            <i class="far fa-bell menu-icon"></i>
                        </button>
                    </div>
                </div>
            </div>
            <div class="head-user-avatar-container">
                <div class="head-user-avatar">
                    <div class="menu-wrap" (mouseenter)="toggleSubMenu(true)" (mouseleave)="toggleSubMenu(false)">
                        <img src="" class="user-avatar" alt="user">
                        <div class="circle-indicator pulse"></div>
                        <div class="sub-menu-wrap" id="subMenu" [ngStyle]="{'max-height.px': isSubMenuOpen ? 400 : 0}">
                            <div class="sub-menu">
                                <a [routerLink]="['feature/profile/editprofile']" class="sub-menu-link">
                                    <i class="fas fa-user-circle"></i>
                                    <p>
                                        Edit Profile
                                    </p>
                                </a>
                                <a href="#" class="sub-menu-link">
                                    <i class="fa fa-question-circle"></i>
                                    <p>
                                        Help & Support
                                    </p>
                                </a>
                                <a href="#" class="sub-menu-link">
                                    <i class="fa fa-sign-out"></i>
                                    <p>Logout</p>
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
